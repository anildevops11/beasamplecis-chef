name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Chef Workstation
        run: |
          curl -L https://omnitruck.chef.io/install.sh | sudo bash -s -- -P chef-workstation

      - name: Cookstyle lint
        run: cookstyle chef/cookbooks/cis_level1

      - name: Test Kitchen converge + verify
        working-directory: chef/cookbooks/cis_level1
        run: |
          kitchen test --destroy=always

      - name: Terraform format & validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform -chdir=environments/production init -backend=false
          terraform -chdir=environments/production validate
